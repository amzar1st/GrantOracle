name: Verify GrantOracle
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r requirements-dev.txt
      - run: python scripts/prepare-test-sdk.py
      - run: npm test
      - run: python -m pytest -q tests/test_contract.py tests/test_example.py
      - run: genvm-lint check contracts/grant_oracle.py
      - run: npm run build
